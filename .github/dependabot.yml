version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Workflows pin actions to full commit SHAs with "# vX.Y.Z" comments;
  # Dependabot updates both the pinned SHA and the version comment in place.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
