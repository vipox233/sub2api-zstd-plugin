name: Bug 反馈
description: 反馈插件安装、图片优化、Zstd 压缩或转发异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿在 Issue 中粘贴 OAuth Token、API Key、Cookie、完整原始请求体或签名私钥。

  - type: input
    id: versions
    attributes:
      label: 版本与运行环境
      description: 插件版本、Sub2API 版本及宿主部署方式
      placeholder: "例如：插件 v1.5.0 / Sub2API 0.2.23 / Docker (linux-amd64)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题现象与复现步骤
      description: 说明实际现象、预期行为以及触发步骤
      placeholder: |
        1. 开启图片优化（1080p / Q78），发送包含 2 张 PNG 截图的 Codex OAuth HTTP 请求
        2. 面板「最近请求」显示……
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 关键配置与面板统计（可选）
      description: 可附上图片/Zstd 关键设置、「最近请求」体积与跳过原因，或脱敏后的错误日志
      render: text
